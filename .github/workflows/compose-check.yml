name: Compose Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode repository
        uses: actions/checkout@v4

      - name: Siapkan file environment
        run: cp .env.example .env

      - name: Validasi Docker Compose
        run: docker compose config -q
